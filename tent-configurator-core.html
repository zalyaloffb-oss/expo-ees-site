      .box3d {
        --bw: 360px;
        --bd: 260px;
        --bh: 150px;
        position: relative;
        width: var(--bw);
        height: var(--bh);
        transform-style: preserve-3d;
        transform: rotateX(-22deg) rotateY(-35deg);
      }
      .face3d {
        position: absolute;
        border: 2px solid #ffffffaa;
        box-shadow: inset 0 0 22px #0f172a24;
        backface-visibility: visible;
        opacity: 0.9;
      }
      .front3d,
      .back3d {
        width: var(--bw);
        height: var(--bh);
        left: 0;
        top: 0;
      }
      .front3d {
        transform: translateZ(calc(var(--bd) / 2));
      }
      .back3d {
        transform: rotateY(180deg) translateZ(calc(var(--bd) / 2));
      }
      .left3d,
      .right3d {
        width: var(--bd);
        height: var(--bh);
        top: 0;
        left: calc((var(--bw) - var(--bd)) / 2);
      }
      .left3d {
        transform: rotateY(-90deg) translateZ(calc(var(--bw) / 2));
      }
      .right3d {
        transform: rotateY(90deg) translateZ(calc(var(--bw) / 2));
      }
      .floor3d {
        width: var(--bw);
        height: var(--bd);
        left: 0;
        top: calc((var(--bh) - var(--bd)) / 2);
        transform: rotateX(90deg) translateZ(calc(var(--bh) / -2));
        background: repeating-linear-gradient(
          0deg,
          #e8edf3 0,
          #e8edf3 24px,
          #cfd8e3 25px
        );
        opacity: 1;
      }

      function renderPagodaArrayEditor() {
        const control = $("#pagodaArrayControl"),
          grid = $("#pagodaArrayGrid"),
          wallEditor = $("#pagodaWallEditor"),
          pagoda = $("#type")?.value === "Пагода";

        control.hidden = !pagoda;
        if (!pagoda) return;
        const radius = 4,
          parts = [];
        for (let z = -radius; z <= radius; z++)
          for (let x = -radius; x <= radius; x++) {
            const key = `${x}:${z}`,
              active = pagodaModules.has(key),
              available = !active && [
                `${x - 1}:${z}`,
                `${x + 1}:${z}`,
                `${x}:${z - 1}`,
                `${x}:${z + 1}`,
              ].some((neighbor) => pagodaModules.has(neighbor));
            parts.push(
              `<button class="${active ? "active" : available ? "available" : ""}" data-pagoda-module="${key}"${active || available ? "" : " disabled"} aria-label="${active ? "Удалить" : "Добавить"} модуль ${x}, ${z}"></button>`,
            );
          }
        grid.innerHTML = parts.join("");
        if (!wallEditor) return;
        const modules = normalizedPagodaModules().sort((a, b) => a.gridZ - b.gridZ || a.gridX - b.gridX),
          occupied = new Set(modules.map((module) => `${module.gridX}:${module.gridZ}`)),
          options = [...pagodaMaterialNames];
        wallEditor.innerHTML = `<label class="label">Стены каждой пагоды</label>` + modules.map((module, index) => {
          const external = [
            ["top", module.gridX, module.gridZ - 1],
            ["right", module.gridX + 1, module.gridZ],
            ["bottom", module.gridX, module.gridZ + 1],
            ["left", module.gridX - 1, module.gridZ],
          ].filter(([, x, z]) => !occupied.has(`${x}:${z}`));
          return `<div class="pagoda-wall-card"><strong>Пагода ${index + 1} · ряд ${module.gridZ + 1}, колонка ${module.gridX + 1}</strong>${external.map(([side]) => `<label class="pagoda-wall-row"><span>${SN[side].replace(" сторона", "")}</span><select data-pagoda-wall-select="${side}" data-pagoda-module-key="${module.key}">${options.map((material) => `<option${material === pagodaWallMaterial(module.key, side) ? " selected" : ""}>${material}</option>`).join("")}</select></label>`).join("")}</div>`;
        }).join("");
      }

          maxY = -1;

                  pixels[index + 2] < 248)

                const y = tileY + localY;

          return `${heading}<tr><td>${escapeReport(item.name)}</td><td>${escapeReport(item.unit)}</td><td><input type="number" min="0" step="50" data-price-id="${item.id}" value="${+priceOverrides[item.id] || 0}" aria-label="Цена ${escapeReport(item.name)}"></td><td>${editableQty ? `<input class="qty-input" type="number" min="0" step="1" data-qty-id="${item.id}" value="${qty}" aria-label="Количество ${escapeReport(item.name)}">` : qty}</td><td data-line-id="${item.id}">${money(qty * (+priceOverrides[item.id] || 0) * rentalDays)}</td></tr>`;
        }).join("");
      }
      function refreshPriceModalTotals() {
        modalBody.querySelectorAll("[data-line-id]").forEach((cell) => {
          const item = PRICE_CATALOG.find((entry) => entry.id === cell.dataset.lineId);
          if (item) cell.textContent = money(catalogQuantity(item) * (+priceOverrides[item.id] || 0) * rentalDays);
        });
        const total = modalBody.querySelector("#priceModalTotal");
        if (total) total.textContent = money(projectRentalTotal());
        const daysLabel = modalBody.querySelector("#priceDaysLabel");
        if (daysLabel) daysLabel.textContent = `${rentalDays} дн. аренды · итого с НДС`;
      }
      function showPriceList() {
        openDataModal("Прайс-лист и комплектация", `
          <p class="data-modal-note">Ориентировочные цены указаны за сутки с НДС. Изменения сохраняются в браузере; количество мебели берётся из плана, климатическое и мультимедийное оборудование задаётся здесь.</p>
          <div class="data-toolbar price-toolbar"><a class="data-button" href="${SHEETS_CONFIG.priceUrl}" target="_blank" rel="noopener">Открыть Google Таблицу</a><button class="data-button primary" id="savePrices">Сохранить цены</button><label class="rental-days-inline">Количество дней<input id="priceRentalDays" type="number" min="1" max="365" step="1" value="${rentalDays}" inputmode="numeric"></label></div>
          <div class="data-table-wrap price-scroll"><table class="data-table"><thead><tr><th>Позиция</th><th>Единица</th><th>Цена, ₽/сутки</th><th>Кол-во</th><th>Стоимость с НДС</th></tr></thead><tbody>${priceRowsHtml()}</tbody></table></div>
          <div class="modal-total"><span id="priceDaysLabel">${rentalDays} дн. аренды · итого с НДС</span><strong id="priceModalTotal">${money(projectRentalTotal())}</strong></div>
          <details class="sync-panel"><summary>Подключение автоматической синхронизации с Google Таблицами</summary><p class="data-modal-note">Один раз разверните подготовленный скрипт как веб-приложение Google Apps Script и вставьте его адрес ниже. После этого цены и проекты будут синхронизироваться с таблицами.</p><div class="data-toolbar"><input id="appsScriptUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${escapeReport(localStorage.getItem(SCRIPT_URL_KEY) || "")}"><button class="data-button" id="syncGoogle">Подключить и загрузить цены</button><a class="data-button" href="/google-apps-script.gs" download>Скачать скрипт</a></div><div class="sync-status" id="syncStatus">Сейчас используется локальное сохранение на этом устройстве.</div></details>`);
        modalBody.oninput = (event) => {
          const priceInput = event.target.closest("[data-price-id]"), qtyInput = event.target.closest("[data-qty-id]");
          if (event.target.id === "priceRentalDays") {
            rentalDays = Math.max(1, Math.min(365, Math.round(+event.target.value || 1)));
            $("#rentalDays").value = rentalDays;
          }
          if (priceInput) priceOverrides[priceInput.dataset.priceId] = Math.max(0, +priceInput.value || 0);
          if (qtyInput) equipmentQuantities[qtyInput.dataset.qtyId] = Math.max(0, Math.round(+qtyInput.value || 0));
          applyPriceOverrides();
          refreshPriceModalTotals();
        };
        modalBody.onchange = (event) => {
          if (event.target.id === "priceRentalDays") event.target.value = rentalDays;
        };
        $("#savePrices").onclick = async () => {
          applyPriceOverrides();
          const status = $("#syncStatus"), scriptUrl = localStorage.getItem(SCRIPT_URL_KEY);
          if (scriptUrl) {
            try {
              await fetch(scriptUrl, { method: "POST", body: JSON.stringify({ action: "savePrices", prices: priceOverrides }) });
              status.textContent = "Цены сохранены локально и отправлены в Google Таблицу.";
            } catch { status.textContent = "Цены сохранены локально. Google Таблица временно недоступна."; }
          } else status.textContent = "Цены сохранены локально. Для Google Таблицы выполните подключение ниже.";
        };
        $("#syncGoogle").onclick = syncPricesFromGoogle;
      }
      async function syncPricesFromGoogle() {
        const input = $("#appsScriptUrl"), status = $("#syncStatus"), url = input.value.trim();
        if (!/^https:\/\/script\.google\.com\//.test(url)) {
          status.textContent = "Вставьте адрес развернутого веб-приложения Google Apps Script.";
          return;
        }
        localStorage.setItem(SCRIPT_URL_KEY, url);
        status.textContent = "Загрузка цен…";
        try {
          const response = await fetch(`${url}?action=prices`), data = await response.json(), source = data.prices || data;
          if (Array.isArray(source)) source.forEach((row) => { if (row.id) priceOverrides[row.id] = +row.price || 0; });
          else Object.entries(source).forEach(([id, price]) => priceOverrides[id] = +price || 0);
          applyPriceOverrides();
          status.textContent = "Подключено. Цены загружены из Google Таблицы.";
          showPriceList();
        } catch { status.textContent = "Не удалось подключиться. Проверьте публикацию скрипта и доступ «Все»."; }
      }
      function projectSnapshot(name, id) {
        return {
          id: id || (crypto.randomUUID?.() || `project-${Date.now()}`),
          name: name || "Проект без названия",
          savedAt: new Date().toISOString(),
          type: $("#type").value, W, L, pagodaModuleSize,
          pagodaModules: [...pagodaModules], placed: { ...placed }, angles: { ...angles }, mirrors: JSON.parse(JSON.stringify(mirrors)),
          wallDoors: JSON.parse(JSON.stringify(wallDoors)), wallBays: { ...wallBays }, pagodaWalls: { ...pagodaWalls }, walls: { ...walls }, gables: { ...gables },
          ridgeHeight: RIDGE_HEIGHT, rentalDays, equipmentQuantities: { ...equipmentQuantities }, total: projectRentalTotal(),
        };
      }
      function localProjects() {
        try { return JSON.parse(localStorage.getItem(PROJECT_STORAGE_KEY) || "[]"); } catch { return []; }
      }
      async function saveProjectRecord(name) {
        const projects = localProjects(), existing = projects.find((item) => item.name === name), snapshot = projectSnapshot(name, existing?.id);
        const next = [snapshot, ...projects.filter((item) => item.id !== snapshot.id)].slice(0, 100);
        localStorage.setItem(PROJECT_STORAGE_KEY, JSON.stringify(next));
        const scriptUrl = localStorage.getItem(SCRIPT_URL_KEY);
        if (scriptUrl) {
          try { await fetch(scriptUrl, { method: "POST", body: JSON.stringify({ action: "saveProject", project: snapshot }) }); } catch {}
        }
        return snapshot;
      }
      function restoreProject(project) {
        $("#type").value = project.type || "Двускатный шатёр";
        W = +project.W || 5; L = +project.L || 10;
        pagodaModuleSize = +project.pagodaModuleSize || 5;
        pagodaModules = new Set(project.pagodaModules?.length ? project.pagodaModules : ["0:0"]);
        placed = project.placed || {}; angles = project.angles || {}; mirrors = project.mirrors || {}; wallDoors = project.wallDoors || {}; wallBays = project.wallBays || {};
        pagodaWalls = project.pagodaWalls || {}; trimPagodaWalls();
        walls = project.walls || walls; gables = project.gables || gables;
        RIDGE_HEIGHT = +project.ridgeHeight || 6; rentalDays = Math.max(1, +project.rentalDays || 1);
        equipmentQuantities = project.equipmentQuantities || {};
        syncDimensionOptions(false);
        $("#width").value = $("#type").value === "Пагода" ? pagodaModuleSize : W;
        $("#length").value = $("#type").value === "Пагода" ? pagodaModuleSize : L;
        $("#ridgeHeight").value = RIDGE_HEIGHT; $("#ridgeValue").textContent = `${RIDGE_HEIGHT.toLocaleString("ru-RU")} м`;
        $("#rentalDays").value = rentalDays;
        active = null; selectedGroups.clear(); render(); if (view3D) render3D();
        closeDataModal();
      }
      async function showProjects(loadRemote = true) {
        const scriptUrl = localStorage.getItem(SCRIPT_URL_KEY);
        if (loadRemote && scriptUrl) {
          try {
            const response = await fetch(`${scriptUrl}?action=projects`), data = await response.json(), remote = (data.projects || []).map((row) => {
              try { return typeof row.configuration === "string" ? JSON.parse(row.configuration) : row; } catch { return row; }
            });
            const merged = [...remote, ...localProjects()].filter((item, index, list) => item?.id && list.findIndex((candidate) => candidate.id === item.id) === index);
            localStorage.setItem(PROJECT_STORAGE_KEY, JSON.stringify(merged));
          } catch {}
        }
        const projects = localProjects().sort((a, b) => String(b.savedAt).localeCompare(String(a.savedAt)));
        openDataModal("Проекты", `
          <p class="data-modal-note">Сохранённые проекты доступны на этом устройстве. После подключения Google Apps Script они также записываются в таблицу проектов.</p>
          <div class="data-toolbar"><a class="data-button" href="${SHEETS_CONFIG.projectsUrl}" target="_blank" rel="noopener">Открыть Google Таблицу</a><button class="data-button primary" id="newProjectSave">Сохранить текущий проект</button></div>
          <div class="data-table-wrap"><table class="data-table"><thead><tr><th>Название</th><th>Время сохранения</th><th>Конструкция</th><th>Стоимость с НДС</th><th></th></tr></thead><tbody>${projects.length ? projects.map((project) => `<tr><td>${escapeReport(project.name)}</td><td>${new Date(project.savedAt).toLocaleString("ru-RU")}</td><td>${escapeReport(project.type)} · ${project.W} × ${project.L} м</td><td>${money(project.total)}</td><td><div class="project-actions"><button class="data-button" data-open-project="${project.id}">Открыть</button><button class="data-button danger" data-delete-project="${project.id}">Удалить</button></div></td></tr>`).join("") : '<tr><td colspan="5">Сохранённых проектов пока нет</td></tr>'}</tbody></table></div>`);
        $("#newProjectSave").onclick = showSaveProject;
        modalBody.onclick = async (event) => {
          const open = event.target.closest("[data-open-project]"), remove = event.target.closest("[data-delete-project]");
          if (open) { const project = localProjects().find((item) => item.id === open.dataset.openProject); if (project) restoreProject(project); }
          if (remove) {
            localStorage.setItem(PROJECT_STORAGE_KEY, JSON.stringify(localProjects().filter((item) => item.id !== remove.dataset.deleteProject)));
            if (scriptUrl) { try { await fetch(scriptUrl, { method: "POST", body: JSON.stringify({ action: "deleteProject", projectId: remove.dataset.deleteProject }) }); } catch {} }
            showProjects(false);
          }
        };
      }
      function showSaveProject() {
        openDataModal("Сохранить проект", `<p class="data-modal-note">Укажите понятное название — дата и время сохранятся автоматически.</p><div class="data-toolbar"><input id="projectNameInput" maxlength="80" placeholder="Например, Выставка 15 × 20 м"><button class="data-button primary" id="confirmProjectSave">Сохранить</button></div><div class="sync-status" id="projectSaveStatus"></div>`);
        $("#confirmProjectSave").onclick = async () => {
          const input = $("#projectNameInput"), status = $("#projectSaveStatus"), name = input.value.trim();
          if (!name) { status.textContent = "Введите название проекта."; input.focus(); return; }
          status.textContent = "Сохранение…";
          const saved = await saveProjectRecord(name);
          status.textContent = `Сохранено: ${new Date(saved.savedAt).toLocaleString("ru-RU")}`;
          setTimeout(showProjects, 450);
        };
      }
      $("#width").onchange = (e) => {
        const value = +e.target.value;
        if ($("#type").selectedIndex === 2) {
          pagodaModuleSize = value;
          $("#length").value = value;
          resizePagodaArray();
        } else resizeTent(value, L);
      };
      $("#length").onchange = (e) => {
        const value = +e.target.value;
        if ($("#type").selectedIndex === 2) {
          pagodaModuleSize = value;
          $("#width").value = value;
          resizePagodaArray();
        } else resizeTent(W, value);
      };
      $("#pagodaArrayGrid").addEventListener("click", (e) => {
        const button = e.target.closest("[data-pagoda-module]");
        if (!button || button.disabled) return;
        const key = button.dataset.pagodaModule;
        if (pagodaModules.has(key)) {
          if (pagodaModules.size === 1) return;
          const next = new Set(pagodaModules);
          next.delete(key);
          if (!pagodaModulesConnected(next)) {
            alert("Нельзя разделить массив пагод на несвязанные части");
            return;
          }
          pagodaModules = next;
        } else pagodaModules.add(key);
        trimPagodaWalls();
        resizePagodaArray();
      });
      $("#pagodaWallEditor").addEventListener("change", (e) => {
        const select = e.target.closest("[data-pagoda-wall-select]");
        if (!select) return;
        setPagodaWallMaterial(
          select.dataset.pagodaModuleKey,
          select.dataset.pagodaWallSelect,
          select.value,
        );
        render();
      });
      $("#ridgeHeight").oninput = (e) => {
        RIDGE_HEIGHT = Math.max(EAVE_HEIGHT + 0.5, Math.min(12, +e.target.value || 6));
        $("#ridgeValue").textContent = `${RIDGE_HEIGHT.toLocaleString("ru-RU")} м`;
        render();
      };
      $("#rentalDays").oninput = (e) => {
        rentalDays = Math.max(
          1,
          Math.min(365, Math.round(+e.target.value || 1)),
        );
      };
      $("#rentalDays").onchange = (e) => {
        e.target.value = rentalDays;
      };
      $("#type").onchange = render;
      $("#clear").onclick = () => {
        placed = {};
        angles = {};
        wallDoors = {};
        selectedGroups.clear();
        active = null;
        render();
      };
      $("#projectsButton").onclick = showProjects;
      $("#priceListButton").onclick = showPriceList;
      $("#saveProjectButton").onclick = showSaveProject;
      $("#exportPdf").onclick = exportPdfReport;
      const SIDE_COLLAPSED_KEY = "ees-side-collapsed";
      function setSideCollapsed(collapsed) {
        document.body.classList.toggle("side-collapsed", collapsed);
        const button = $("#sideToggle");
        button.setAttribute("aria-expanded", String(!collapsed));
        button.setAttribute(
          "aria-label",
          collapsed ? "Развернуть параметры шатра" : "Свернуть параметры шатра",
        );
        button.title = collapsed
          ? "Развернуть параметры"
          : "Свернуть параметры";
        localStorage.setItem(SIDE_COLLAPSED_KEY, collapsed ? "1" : "0");
        setTimeout(() => {
          if (view3D) drawTent3D();
        }, 260);
      }
      setSideCollapsed(localStorage.getItem(SIDE_COLLAPSED_KEY) === "1");
      $("#sideToggle").onclick = () =>
        setSideCollapsed(!document.body.classList.contains("side-collapsed"));
      render();
      const configuredScriptUrl = localStorage.getItem(SCRIPT_URL_KEY);
      if (configuredScriptUrl) {
        fetch(`${configuredScriptUrl}?action=prices`)
          .then((response) => response.json())
          .then((data) => {
            const source = data.prices || data;
            if (Array.isArray(source)) source.forEach((row) => { if (row.id) priceOverrides[row.id] = +row.price || 0; });
            else Object.entries(source).forEach(([id, price]) => priceOverrides[id] = +price || 0);
            applyPriceOverrides();
          })
          .catch(() => {});
      }
    </script></body>
